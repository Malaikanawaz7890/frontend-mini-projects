<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Smart To-Do Manager</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="todo-card">

            <!-- HEADER -->

            <div class="header">

                <div>

                    <p class="small-title">MY PRODUCTIVITY</p>

                    <h1>TaskFlow</h1>

                    <p class="subtitle">
                        Plan your work. Track your progress.
                    </p>

                </div>

                <button id="themeBtn" class="theme-btn">
                    ☀️
                </button>

            </div>


            <!-- STATISTICS -->

            <div class="stats">

                <div class="stat-box">
                    <span id="totalCount">0</span>
                    <small>Total</small>
                </div>

                <div class="stat-box">
                    <span id="pendingCount">0</span>
                    <small>Pending</small>
                </div>

                <div class="stat-box">
                    <span id="completedCount">0</span>
                    <small>Completed</small>
                </div>

            </div>


            <!-- ADD TASK -->

            <div class="input-area">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                >

                <select id="prioritySelect">

                    <option value="low">Low</option>

                    <option value="medium" selected>
                        Medium
                    </option>

                    <option value="high">High</option>

                </select>

                <button id="addBtn">
                    Add
                </button>

            </div>


            <!-- SEARCH -->

            <div class="search-area">

                <span>🔍</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search tasks..."
                >

            </div>


            <!-- FILTERS -->

            <div class="filters">

                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="pending">
                    Pending
                </button>

                <button class="filter" data-filter="completed">
                    Completed
                </button>

            </div>


            <!-- TASK LIST -->

            <div id="taskList" class="task-list">

                <div class="empty-state">

                    <div class="empty-icon">
                        ✓
                    </div>

                    <h3>No tasks yet</h3>

                    <p>
                        Add your first task to get started.
                    </p>

                </div>

            </div>


            <!-- FOOTER -->

            <div class="footer">

                <span id="footerCount">
                    0 tasks
                </span>

                <button id="clearCompleted">
                    Clear Completed
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
